# 放到你 fork 的仓库：.github/workflows/build-apk.yml
# 点 Actions → Build APK → Run workflow → 等 40 分钟 → 下载 artifact 里的 apk。
# 说明：dsh-go 官方仓库只跑 runtime 和测试，不产出 APK，所以这个文件是我补的。
name: Build APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'arm64（手机）或 x64（模拟器）'
        default: arm64
        type: choice
        options: [arm64, x64]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 24（runtime 构建要用）
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android SDK 许可
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 构建运行时（rootfs + proot so）
        # 注意：build-runtime.sh 用的是 arm64-v8a / x86_64，build-apk.sh 用的是 arm64 / x64
        run: |
          chmod +x runtime/build-runtime.sh
          runtime/build-runtime.sh ${{ inputs.flavor == 'arm64' && 'arm64-v8a' || 'x86_64' }}

      - name: 构建 APK
        run: |
          chmod +x tooling/build-apk.sh
          tooling/build-apk.sh -f ${{ inputs.flavor }}

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-${{ inputs.flavor }}
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/apk/**/*.apk
          if-no-files-found: error
